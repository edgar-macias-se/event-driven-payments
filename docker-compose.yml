services:
  postgres:
    image: postgres:16-alpine
    container_name: payments-postgres
    environment:
      POSTGRES_DB: payments_db
      POSTGRES_USER: payments_user
      POSTGRES_PASSWORD: payments_pass
      POSTGRES_INITDB_ARGS: '-E UTF8 --locale=en_US.utf8'
    ports:
      - '6543:5432'
    volumes:
      - postgres_data:/varlib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payments_user -d payments_db']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - payments-network

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: payments_kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker, controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      #LISTENERS
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092, CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # ──────────────────────────────────────────────────────────
      # Storage
      # ──────────────────────────────────────────────────────────
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: '0EeQbgdSQ9ipSn5X0Iqtlg'

      # ──────────────────────────────────────────────────────────
      # Performance tuning (para desarrollo local)
      # ──────────────────────────────────────────────────────────
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    ports:
      - '9092:9092'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'kafka-broker-api-versions --bootstrap-server localhost:9092',
        ]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - payments-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: payments-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: payments-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - '8080:8080'
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - payments-network
  relay:
    build:
      context: ./relay
      dockerfile: Dockerfile
    container_name: payments-relay
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: payments_user
      DB_PASSWORD: payments_pass
      DB_DATABASE: payments_db
      KAFKA_BROKERS: kafka:9092
      RELAY_POLLING_INTERVAL_MS: 500
      RELAY_BATCH_SIZE: 50
      RELAY_MAX_RETRIES: 3
      OTEL_EXPORTER_OTLP_ENDPOINT: localhost:4317
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - payments-network
    restart: unless-stopped
  # ════════════════════════════════════════════════════════════════
  # OpenTelemetry Collector - Recibe y exporta telemetry
  # ════════════════════════════════════════════════════════════════
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.91.0
    container_name: payments-otel-collector
    command: ['--config=/etc/otel-collector-config.yaml']
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - '4317:4317' # OTLP gRPC receiver
      - '4318:4318' # OTLP HTTP receiver
      - '8888:8888' # Prometheus metrics (collector itself)
      - '8889:8889' # Prometheus exporter
    networks:
      - payments-network
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════════
  # Prometheus - Time-series database for metrics
  # ════════════════════════════════════════════════════════════════
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: payments-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - '9090:9090'
    networks:
      - payments-network
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════════
  # Jaeger - Distributed tracing backend
  # ════════════════════════════════════════════════════════════════
  jaeger:
    image: jaegertracing/all-in-one:1.52
    container_name: payments-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - '16686:16686' # Jaeger UI
      - '14268:14268' # Jaeger collector HTTP
      - '14250:14250' # Jaeger collector gRPC
    networks:
      - payments-network
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════════
  # Loki - Log aggregation system
  # ════════════════════════════════════════════════════════════════
  loki:
    image: grafana/loki:2.9.3
    container_name: payments-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - '3100:3100'
    volumes:
      - loki-data:/loki
    networks:
      - payments-network
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════════
  # Grafana - Unified visualization dashboard
  # ════════════════════════════════════════════════════════════════
  grafana:
    image: grafana/grafana:10.2.3
    container_name: payments-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    ports:
      - '3001:3000' # Port 3001 (avoid conflict with Payment API on 3000)
    networks:
      - payments-network
    depends_on:
      - prometheus
      - jaeger
      - loki
    restart: unless-stopped
# ════════════════════════════════════════════════════════════════
# Volumes (persistencia de datos)
# Sin estos, los datos se pierden al hacer docker-compose down
# ════════════════════════════════════════════════════════════════
volumes:
  postgres_data:
  kafka_data:
  prometheus-data:
  loki-data:
  grafana-data:
# ════════════════════════════════════════════════════════════════
# Network (red interna para que los servicios se comuniquen)
# ════════════════════════════════════════════════════════════════
networks:
  payments-network:
    driver: bridge
