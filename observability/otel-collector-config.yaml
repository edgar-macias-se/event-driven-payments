# OpenTelemetry Collector Configuration
# Recibe telemetry de apps y la exporta a múltiples backends

receivers:
  # OTLP receiver (apps envían aquí)
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Prometheus receiver (scrapea métricas del collector mismo)
  prometheus:
    config:
      scrape_configs:
        - job_name: 'otel-collector'
          scrape_interval: 10s
          static_configs:
            - targets: ['localhost:8888']

processors:
  # Batch processor (agrupa telemetry para eficiencia)
  batch:
    timeout: 10s
    send_batch_size: 1024

  # Memory limiter (previene OOM)
  memory_limiter:
    check_interval: 1s
    limit_mib: 512

  # Resource processor (agrega atributos globales)
  resource:
    attributes:
      - key: environment
        value: development
        action: insert
      - key: service.namespace
        value: payments
        action: insert

exporters:
  # Exportar metrics a Prometheus
  prometheus:
    endpoint: '0.0.0.0:8889'
    namespace: payments
    const_labels:
      env: development

  # Exportar traces a Jaeger
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Exportar logs a Loki
  loki:
    endpoint: http://loki:3100/loki/api/v1/push

  # Debug exporter (logs to console)
  logging:
    verbosity: detailed

service:
  pipelines:
    # Metrics pipeline
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch, resource]
      exporters: [prometheus, logging]

    # Traces pipeline
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [otlp/jaeger, logging]

    # Logs pipeline
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [loki, logging]

  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:8888
