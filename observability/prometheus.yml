# Prometheus configuration

global:
  scrape_interval: 15s # Scrapear cada 15 segundos
  evaluation_interval: 15s # Evaluar reglas cada 15 segundos

# Alertmanager configuration (opcional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Scrape configs (qué scrapear)
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # OpenTelemetry Collector metrics
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']

  # OpenTelemetry Collector exporter (app metrics)
  - job_name: 'payments-services'
    static_configs:
      - targets: ['otel-collector:8889']
        labels:
          service: 'payment-api'
